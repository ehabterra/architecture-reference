name: "🐞 Website bug"
description: "Something broken: a button, layout, a diagram, navigation…"
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is for problems with *the site itself* (for a mistake in a lesson, use the
        “Content correction” template instead).

  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
      description: "Describe the problem in a sentence or two."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "How to reproduce"
      description: "Simple steps we can follow to see it."
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: expected
    attributes:
      label: "What did you expect to happen?"
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: "Where is it?"
      options:
        - "A lesson page"
        - "A diagram (Mermaid)"
        - "Language toggle (English / Arabic)"
        - "Search / ⌘K palette"
        - "Progress / quizzes"
        - "Navigation / home / track pages"
        - "Other (describe above)"
    validations:
      required: false

  - type: dropdown
    id: device
    attributes:
      label: "Device & browser"
      options:
        - "Desktop — Chrome"
        - "Desktop — Safari"
        - "Desktop — Firefox"
        - "iPhone / iPad — Safari"
        - "Android — Chrome"
        - "Other (describe above)"
    validations:
      required: false
